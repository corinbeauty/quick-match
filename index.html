<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>票券快速掃描累加器</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tesseract.js (OCR) -->
    <script src="https://unpkg.com/tesseract.js@v4.1.1/dist/tesseract.min.js"></script>
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            overscroll-behavior-y: none; /* 防止手機下拉更新干擾 */
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #10b981; /* Tailwind emerald-500 */
            box-shadow: 0 0 10px #10b981;
            animation: scan 2s infinite linear;
            display: none;
        }
        .scanning .scan-line {
            display: block;
        }
        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }
        /* 隱藏捲軸但可滾動 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 新增：成功掃描的閃爍特效 */
        @keyframes flash-success {
            0% { background-color: #10b981; opacity: 0.5; }
            100% { background-color: transparent; opacity: 1; }
        }
        .flash-active {
            animation: flash-success 0.4s ease-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // 圖示組件
        const CameraIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        );

        const TrashIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        );

        const App = () => {
            const [scannedItems, setScannedItems] = useState([]);
            const [isScanning, setIsScanning] = useState(false);
            const [cameraActive, setCameraActive] = useState(false);
            const [statusMsg, setStatusMsg] = useState('系統初始化中...');
            
            // 雙重辨識狀態
            const [candidates, setCandidates] = useState({ tickets: [], amounts: [] });
            const [selected, setSelected] = useState({ ticket: null, amount: null });
            
            const [manualTicket, setManualTicket] = useState('');
            const [manualAmount, setManualAmount] = useState('');
            
            // --- 新增狀態 ---
            const [sessionActive, setSessionActive] = useState(false); // 控制相機與掃描模式的開關
            const [paymentMethod, setPaymentMethod] = useState('現金');
            const [showClearConfirm, setShowClearConfirm] = useState(false);
            
            // --- 動態計算總計 ---
            const totals = scannedItems.reduce((acc, item) => {
                acc[item.payMethod] = (acc[item.payMethod] || 0) + item.amount;
                return acc;
            }, { '現金': 0, '刷卡': 0, 'LINE PAY': 0 });
            const grandTotal = totals['現金'] + totals['刷卡'] + totals['LINE PAY'];

            const [flash, setFlash] = useState(false); // 成功特效
            const [ocrWorker, setOcrWorker] = useState(null); // 常駐 OCR 引擎
            
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const streamRef = useRef(null);

            // 初始化極速 OCR 引擎
            useEffect(() => {
                let worker;
                const initTesseract = async () => {
                    try {
                        setStatusMsg('正在載入高速辨識引擎...');
                        worker = await Tesseract.createWorker({
                            logger: m => {
                                if(m.status === 'loading tesseract core') setStatusMsg('載入核心引擎...');
                            }
                        });
                        // 移除 whitelist 以免 LSTM 引擎因為遇到無法辨識的字(如中文)而發生衝突回傳空白
                        await worker.loadLanguage('eng');
                        await worker.initialize('eng');
                        setOcrWorker(worker);
                        setStatusMsg('引擎準備就緒，請選擇付款方式開始掃描');
                    } catch (e) {
                        console.error(e);
                        setStatusMsg('引擎載入失敗，請重新整理頁面');
                    }
                };
                
                initTesseract();

                return () => {
                    if(worker) worker.terminate();
                    stopCamera();
                };
            }, []);

            const startCamera = async () => {
                try {
                    const constraints = {
                        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
                    };
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                        videoRef.current.onloadedmetadata = () => {
                            videoRef.current.play();
                            setCameraActive(true);
                        };
                    }
                    streamRef.current = stream;
                } catch (err) {
                    console.error("相機啟動失敗:", err);
                    setStatusMsg('無法啟動相機，請確認權限。');
                }
            };

            const stopCamera = () => {
                if (streamRef.current) {
                    streamRef.current.getTracks().forEach(track => track.stop());
                    streamRef.current = null;
                }
                setCameraActive(false);
            };

            const handleStartSession = (method) => {
                setPaymentMethod(method);
                setSessionActive(true);
                setStatusMsg(`已開啟 [${method}] 連續掃描模式`);
                startCamera();
            };

            const handleEndSession = () => {
                setSessionActive(false);
                stopCamera();
                setCandidates({ tickets: [], amounts: [] });
                setStatusMsg(`已結束 ${paymentMethod} 掃描，可選擇其他付款方式繼續`);
            };

            const captureAndScan = async () => {
                if (!videoRef.current || !cameraActive || !ocrWorker) return;

                setIsScanning(true);
                setStatusMsg('極速辨識中...');
                setCandidates({ tickets: [], amounts: [] });
                setSelected({ ticket: null, amount: null });

                const video = videoRef.current;
                const canvas = canvasRef.current;
                // 稍微縮小畫面以提升 OCR 速度，但不影響數字辨識
                canvas.width = 800; 
                canvas.height = (video.videoHeight / video.videoWidth) * 800;
                const ctx = canvas.getContext('2d');
                
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // === 加入黑白高對比濾鏡，大幅提升 OCR 辨識成功率 ===
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const brightness = 0.34 * data[i] + 0.5 * data[i + 1] + 0.16 * data[i + 2];
                    const color = brightness > 130 ? 255 : 0; // 閾值二值化 (去除陰影)
                    data[i] = data[i+1] = data[i+2] = color;
                }
                ctx.putImageData(imgData, 0, 0);
                // ===================================================

                const imageData = canvas.toDataURL('image/jpeg', 0.8);

                try {
                    // 使用常駐 Worker，這步通常在 0.2~0.5 秒內完成
                    const result = await ocrWorker.recognize(imageData);
                    const text = result.data.text;
                    console.log("OCR 原始辨識:", text);
                    parseOCRData(text);
                } catch (error) {
                    console.error("OCR 錯誤:", error);
                    setStatusMsg('辨識失敗，請重試');
                    setIsScanning(false);
                }
            };

            const parseOCRData = (text) => {
                const cleanText = text.replace(/,/g, ''); 
                const tokens = cleanText.split(/\s+/).filter(t => t);
                
                // 擷取前幾個字作為除錯顯示，讓使用者知道相機到底看到了什麼
                const debugPreview = tokens.slice(0, 4).join(' ');
                
                let foundTickets = new Set();
                let foundAmounts = new Set();
                
                tokens.forEach(t => {
                    const hasDollar = t.includes('$') || t.toUpperCase().includes('NT');
                    const numStr = t.replace(/[^0-9]/g, '');
                    if (!numStr) return;
                    
                    const num = parseInt(numStr, 10);
                    
                    // 修改邏輯：金額需 >= 30
                    if (hasDollar && num >= 30) {
                        foundAmounts.add(num);
                    } else if (numStr.length <= 3 && numStr.length > 0) {
                        // 保留原始字串以保留開頭的 0 (如 "05")
                        foundTickets.add(numStr);
                    } else if (num >= 30) {
                        // 數字大於等於 30 也列入候選金額
                        foundAmounts.add(num);
                    }
                });

                const tickets = Array.from(foundTickets);
                const amounts = Array.from(foundAmounts).sort((a,b)=>b-a);

                if (tickets.length === 1 && amounts.length === 1) {
                    // 【極速模式】完美辨識，直接自動加入！
                    handleAddRecord(tickets[0], amounts[0]);
                } else if (tickets.length > 0 || amounts.length > 0) {
                    // 【重疊模式】畫面太亂，請使用者手動點擊配對
                    setCandidates({ tickets, amounts });
                    setStatusMsg(`偵測到多組，請配對 (讀取到: ${debugPreview}...)`);
                    setIsScanning(false);
                } else {
                    setStatusMsg(`未找齊單號與金額 (讀取到: ${debugPreview || '無有效文字'})`);
                    setIsScanning(false);
                }
            };

            const handleCandidateSelect = (type, val) => {
                setSelected(prev => {
                    const next = { ...prev, [type]: val };
                    // 當單號與金額都被選中時，自動加入
                    if (next.ticket && next.amount) {
                        handleAddRecord(next.ticket, next.amount);
                        return { ticket: null, amount: null };
                    }
                    return next;
                });
            };

            const handleAddRecord = (ticket, amount) => {
                const amtNum = parseInt(amount, 10);
                // 防呆機制 1: 拒絕小於 $30 的異常數字
                if(isNaN(amtNum) || amtNum < 30) {
                    setStatusMsg('⚠️ 金額異常或低於 $30，已取消加入');
                    setIsScanning(false);
                    return;
                }
                
                // 防呆機制 2: 檢查是否重複掃描單號
                const isDuplicate = scannedItems.some(item => item.ticket === ticket);
                if (isDuplicate) {
                    setStatusMsg(`❌ 拒絕加入：單號 ${ticket} 已經存在列表中！`);
                    // 重置狀態，避免卡住
                    setCandidates({ tickets: [], amounts: [] });
                    setSelected({ ticket: null, amount: null });
                    setIsScanning(false);
                    return;
                }
                
                const newItem = {
                    id: Date.now(),
                    ticket: ticket || '無票號',
                    amount: amtNum,
                    payMethod: paymentMethod, // 新增付款方式
                    timestamp: new Date().toLocaleTimeString('zh-TW', { hour12: false })
                };
                
                setScannedItems(prev => [newItem, ...prev]);
                
                // 重置狀態以利下一次極速掃描
                setCandidates({ tickets: [], amounts: [] });
                setSelected({ ticket: null, amount: null });
                setManualTicket('');
                setManualAmount('');
                setIsScanning(false);
                
                // 成功特效與訊息
                triggerFlash();
                setStatusMsg(`✅ 成功加入單號 ${ticket} ($${amtNum})，請掃下一張！`);
            };

            const triggerFlash = () => {
                setFlash(true);
                setTimeout(() => setFlash(false), 400);
            };

            const handleManualSubmit = (e) => {
                e.preventDefault();
                if(manualAmount) {
                    handleAddRecord(manualTicket || '手動', manualAmount);
                }
            };

            const handleDelete = (id) => {
                setScannedItems(prev => prev.filter(item => item.id !== id));
            };

            const handleClearAll = () => {
                setScannedItems([]);
                setShowClearConfirm(false);
                setStatusMsg('✅ 已清除所有紀錄，重新開始');
            };

            return (
                <div className="h-screen flex flex-col w-full bg-gray-100 overflow-hidden relative">
                    {/* Header: 上方 1/5 區域 (約 20vh) */}
                    <div className={`h-[20vh] bg-blue-600 text-white p-4 shadow-lg z-20 shrink-0 flex flex-col justify-between transition-colors ${flash ? 'flash-active bg-emerald-500' : ''}`}>
                        <div className="flex justify-between items-start">
                            <div>
                                <h1 className="text-sm md:text-base font-semibold opacity-90 mb-1">
                                    {sessionActive ? `正在掃描: ${paymentMethod}` : '總累計金額'}
                                </h1>
                                <div className="flex items-baseline space-x-2">
                                    <span className="text-xl md:text-2xl font-bold">NT$</span>
                                    <span className="text-4xl md:text-6xl font-extrabold tracking-tight leading-none">
                                        {sessionActive ? totals[paymentMethod].toLocaleString() : grandTotal.toLocaleString()}
                                    </span>
                                </div>
                            </div>
                            <div className="flex flex-col items-end space-y-3">
                                <span className="bg-white/20 px-3 py-1 rounded-full text-xs font-bold shadow-sm">
                                    共 {scannedItems.length} 筆
                                </span>
                                {sessionActive && (
                                    <button 
                                        onClick={handleEndSession}
                                        className="bg-red-500 hover:bg-red-600 text-white font-black py-2 px-6 rounded-lg shadow-md active:scale-95 transition-transform border-2 border-red-400"
                                    >
                                        完成
                                    </button>
                                )}
                            </div>
                        </div>
                        <p className="text-xs md:text-sm mt-1 opacity-90 font-medium truncate bg-black/20 p-1.5 rounded">{statusMsg}</p>
                    </div>

                    {/* Main Content: 下方 4/5 區域 (約 80vh) */}
                    <div className="h-[80vh] w-full relative">
                        {!sessionActive ? (
                            /* --- 初始畫面：選擇付款方式與歷史紀錄 --- */
                            <div className="flex flex-col h-full p-4 overflow-y-auto hide-scrollbar">
                                <h2 className="text-gray-700 font-bold mb-3 flex items-center">
                                    <CameraIcon /> <span className="ml-2">點擊開啟相機進行掃描：</span>
                                </h2>
                                <div className="flex space-x-3 mb-6 shrink-0">
                                    {['現金', '刷卡', 'LINE PAY'].map(method => (
                                        <button
                                            key={method}
                                            onClick={() => handleStartSession(method)}
                                            className="flex-1 py-5 text-base font-black rounded-xl text-white shadow-md transition-transform active:scale-95 bg-blue-600 hover:bg-blue-700"
                                        >
                                            {method}
                                        </button>
                                    ))}
                                </div>

                                {/* 總計小看板 (閒置時顯示各項總計) */}
                                <div className="flex justify-between items-center text-sm font-bold bg-white p-4 rounded-xl shadow-sm mb-4 shrink-0 border border-gray-200">
                                    <div className="flex flex-col text-orange-600">
                                        <span className="opacity-70 text-xs mb-1">現金</span>
                                        <span className="text-lg">${totals['現金'].toLocaleString()}</span>
                                    </div>
                                    <div className="flex flex-col text-blue-600 border-l border-r border-gray-200 px-6">
                                        <span className="opacity-70 text-xs mb-1">刷卡</span>
                                        <span className="text-lg">${totals['刷卡'].toLocaleString()}</span>
                                    </div>
                                    <div className="flex flex-col text-green-600">
                                        <span className="opacity-70 text-xs mb-1">LINE PAY</span>
                                        <span className="text-lg">${totals['LINE PAY'].toLocaleString()}</span>
                                    </div>
                                </div>

                                {/* History List */}
                                <div className="flex-1 pb-10">
                                    <h2 className="text-gray-500 font-bold mb-3 flex justify-between items-end">
                                        <span>掃描紀錄 ({scannedItems.length})</span>
                                        {scannedItems.length > 0 && (
                                            showClearConfirm ? (
                                                <div className="flex space-x-2 animate-fade-in">
                                                    <button onClick={handleClearAll} className="text-white text-xs px-3 py-1.5 bg-red-500 rounded-md shadow-sm font-bold">確定清除?</button>
                                                    <button onClick={() => setShowClearConfirm(false)} className="text-gray-700 text-xs px-3 py-1.5 bg-gray-300 rounded-md font-bold">取消</button>
                                                </div>
                                            ) : (
                                                <button onClick={() => setShowClearConfirm(true)} className="text-red-500 text-xs font-bold hover:text-red-700 px-3 py-1.5 bg-red-50 rounded-md border border-red-200">
                                                    清除全部重來
                                                </button>
                                            )
                                        )}
                                    </h2>
                                    
                                    {scannedItems.length === 0 ? (
                                        <div className="text-center py-10 text-gray-400 bg-gray-50 rounded-xl border-2 border-dashed border-gray-300">
                                            尚未掃描任何票券
                                        </div>
                                    ) : (
                                        <ul className="space-y-3">
                                            {scannedItems.map((item) => (
                                                <li key={item.id} className="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border-l-4 border-emerald-500 animate-slide-up">
                                                    <div className="flex items-center space-x-4">
                                                        <div className="flex flex-col items-center">
                                                            <div className="bg-gray-100 text-gray-800 font-black px-3 py-1 rounded-md text-lg">
                                                                #{item.ticket}
                                                            </div>
                                                            <div className={`text-[10px] px-2 py-0.5 rounded mt-1 font-bold tracking-wider
                                                                ${item.payMethod === 'LINE PAY' ? 'bg-green-100 text-green-700' : 
                                                                  item.payMethod === '刷卡' ? 'bg-blue-100 text-blue-700' : 
                                                                  'bg-orange-100 text-orange-700'}`}>
                                                                {item.payMethod}
                                                            </div>
                                                        </div>
                                                        <div>
                                                            <span className="block font-black text-gray-800 text-2xl">${item.amount.toLocaleString()}</span>
                                                            <span className="text-xs text-gray-400">{item.timestamp}</span>
                                                        </div>
                                                    </div>
                                                    <button 
                                                        onClick={() => handleDelete(item.id)}
                                                        className="p-3 bg-gray-50 hover:bg-red-100 rounded-full transition-colors text-red-400 hover:text-red-600"
                                                    >
                                                        <TrashIcon />
                                                    </button>
                                                </li>
                                            ))}
                                        </ul>
                                    )}
                                </div>
                            </div>
                        ) : (
                            /* --- 掃描畫面：滿版相機與疊加UI --- */
                            <div className="w-full h-full relative bg-black flex flex-col">
                                <div className={`video-container flex-1 ${isScanning ? 'scanning' : ''}`}>
                                    <video ref={videoRef} playsInline muted></video>
                                    <div className="scan-line"></div>
                                    {!cameraActive && (
                                        <div className="absolute inset-0 flex items-center justify-center bg-gray-900 text-white text-sm">
                                            <p>相機啟動中...</p>
                                        </div>
                                    )}
                                    <canvas ref={canvasRef} className="hidden"></canvas>
                                    
                                    {/* 掃描對準框 (擴大至整個相機畫面) */}
                                    <div className="absolute inset-0 pointer-events-none p-3 overflow-hidden">
                                        <div className="w-full h-full border-4 border-dashed border-emerald-400 rounded-xl relative shadow-[0_0_0_4000px_rgba(0,0,0,0.6)] box-border">
                                            <div className="absolute top-8 left-0 right-0 text-center">
                                                <span className="text-emerald-400 text-lg font-black tracking-widest bg-black/60 px-4 py-2 rounded-lg drop-shadow-md border border-emerald-500/30">
                                                    請將票號與金額置於畫面內
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* 候選配對浮動視窗 (當偵測到多組數字時) */}
                                {(candidates.tickets.length > 0 || candidates.amounts.length > 0) && (
                                    <div className="absolute top-4 left-4 right-4 bg-white/95 border-2 border-indigo-300 rounded-xl p-4 shadow-2xl z-20 animate-fade-in backdrop-blur-md">
                                        <h3 className="text-sm font-bold text-indigo-800 mb-3 text-center">偵測到多組數字，請點擊配對：</h3>
                                        <div className="flex space-x-3">
                                            <div className="flex-1">
                                                <p className="text-xs text-gray-500 mb-2 font-bold bg-gray-100 px-2 py-1 rounded">1. 選票號 👉</p>
                                                <div className="flex flex-wrap gap-2">
                                                    {candidates.tickets.map((t, idx) => (
                                                        <button 
                                                            key={idx} onClick={() => handleCandidateSelect('ticket', t)}
                                                            className={`text-sm font-bold py-2 px-3 rounded-lg shadow-sm
                                                                ${selected.ticket === t ? 'bg-indigo-600 text-white' : 'bg-indigo-50 border border-indigo-200 text-indigo-700'}`}
                                                        >
                                                            {t}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="flex-1 border-l pl-3">
                                                <p className="text-xs text-gray-500 mb-2 font-bold bg-gray-100 px-2 py-1 rounded">2. 選金額 ✅</p>
                                                <div className="flex flex-wrap gap-2">
                                                    {candidates.amounts.map((a, idx) => (
                                                        <button 
                                                            key={idx} onClick={() => handleCandidateSelect('amount', a)}
                                                            className={`text-sm font-bold py-2 px-3 rounded-lg shadow-sm
                                                                ${selected.amount === a ? 'bg-amber-600 text-white' : 'bg-amber-50 border border-amber-200 text-amber-700'}`}
                                                        >
                                                            ${a}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* 手動輸入浮動區塊 (在掃描按鈕上方) */}
                                <form onSubmit={handleManualSubmit} className="absolute bottom-28 left-4 right-4 flex space-x-2 bg-white/95 p-3 rounded-xl backdrop-blur-md shadow-2xl z-20 border border-gray-200">
                                    <input 
                                        type="text" 
                                        value={manualTicket}
                                        onChange={(e) => setManualTicket(e.target.value)}
                                        placeholder="手動輸入票號"
                                        className="w-1/3 px-3 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-center text-sm font-bold"
                                    />
                                    <input 
                                        type="number" 
                                        value={manualAmount}
                                        onChange={(e) => setManualAmount(e.target.value)}
                                        placeholder="輸入金額 $"
                                        className="flex-1 px-3 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm font-bold"
                                    />
                                    <button 
                                        type="submit"
                                        disabled={!manualAmount}
                                        className="px-5 py-3 bg-gray-800 text-white text-sm font-bold rounded-lg disabled:opacity-50 active:scale-95 shadow-md"
                                    >
                                        加入
                                    </button>
                                </form>

                                {/* 拍照/掃描控制按鈕區 (置底固定) */}
                                <div className="absolute bottom-0 left-0 w-full p-4 bg-gradient-to-t from-black/90 via-black/60 to-transparent pt-10 pb-8 z-10 flex justify-center">
                                    <button 
                                        onClick={captureAndScan}
                                        disabled={isScanning || !cameraActive || !ocrWorker}
                                        className={`w-full max-w-sm flex justify-center items-center py-5 rounded-2xl font-black text-xl shadow-[0_4px_20px_rgba(0,0,0,0.5)] transition-transform transform active:scale-95 
                                            ${(isScanning || !ocrWorker)
                                                ? 'bg-gray-400 text-gray-200 cursor-not-allowed' 
                                                : 'bg-emerald-500 text-white border-4 border-emerald-400 hover:bg-emerald-600'}`}
                                    >
                                        {isScanning ? (
                                            <span>照片解析中...</span>
                                        ) : (
                                            <>
                                                <CameraIcon />
                                                <span className="ml-2">拍照辨識 ({paymentMethod})</span>
                                            </>
                                        )}
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes slide-up {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .animate-slide-up {
                animation: slide-up 0.3s ease-out forwards;
            }
            @keyframes fade-in {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            .animate-fade-in {
                animation: fade-in 0.2s ease-out forwards;
            }
        `;
        document.head.appendChild(style);

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
