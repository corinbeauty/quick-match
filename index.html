<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>票券快速掃描累加器 (QR定位極速版)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f3f4f6; margin:0; overscroll-behavior-y:none; }
  .video-container { position:relative; width:100%; height:100%; background:#000; overflow:hidden; }
  video { width:100%; height:100%; object-fit:cover; }
  .hide-scrollbar::-webkit-scrollbar { display:none; }
  .hide-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
  @keyframes flash-success { 0%{background-color:#10b981;opacity:.5} 100%{background-color:transparent;opacity:1} }
  .flash-active { animation:flash-success .3s ease-out; }
  @keyframes slide-up { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .animate-slide-up { animation:slide-up .2s ease-out forwards; }
  
  /* 掃描線動畫 */
  .scan-line { position:absolute; left:0; width:100%; height:2px; background:#10b981; box-shadow:0 0 8px #10b981; animation:scan 1s infinite linear; }
  @keyframes scan { 0%{top:0} 50%{top:100%} 100%{top:0} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const CameraIcon = () => (
  <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0118.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
  </svg>
);
const TrashIcon = () => (
  <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
  </svg>
);
const EditIcon = () => (
  <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4 text-blue-500 inline-block ml-1 opacity-70" viewBox="0 0 20 20" fill="currentColor">
    <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
  </svg>
);

function App() {
  const [scannedItems, setScannedItems] = useState([]);
  const [isScanning, setIsScanning] = useState(false);
  const [cameraActive, setCameraActive] = useState(false);
  const [statusMsg, setStatusMsg] = useState('正在載入極速版 OCR...');
  const [manualAmount, setManualAmount] = useState('');
  const [sessionActive, setSessionActive] = useState(false);
  const [paymentMethod, setPaymentMethod] = useState('現金');
  const [flash, setFlash] = useState(false);
  const [ocrWorker, setOcrWorker] = useState(null);
  const [isAutoScanMode, setIsAutoScanMode] = useState(false);

  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const workerRef = useRef(null);
  const busyRef = useRef(false);

  // 用來精確計算裁切位置的參考框
  const targetBoxRef = useRef(null); 

  const totals = scannedItems.reduce((acc, item) => {
    acc[item.payMethod] = (acc[item.payMethod] || 0) + item.amount;
    return acc;
  }, {'現金':0, '刷卡':0, 'LINE PAY':0});
  const grandTotal = totals['現金'] + totals['刷卡'] + totals['LINE PAY'];
  const currentSessionItems = scannedItems.filter(item => item.payMethod === paymentMethod);

  useEffect(() => {
    let mounted = true;
    (async () => {
      try {
        const worker = await Tesseract.createWorker();
        await worker.loadLanguage('eng');
        await worker.initialize('eng');
        // 極簡白名單，只抓數字與金錢符號
        await worker.setParameters({
          tessedit_char_whitelist: '$S5s0123456789, ', 
          tessedit_pageseg_mode: '7' // 單行模式，速度最快
        });
        if (!mounted) {
          await worker.terminate();
          return;
        }
        workerRef.current = worker;
        setOcrWorker(worker);
        setStatusMsg('引擎就緒，請點選付款方式開啟相機');
      } catch (err) {
        if (mounted) setStatusMsg('載入失敗，請重新整理');
      }
    })();
    return () => { mounted = false; stopCamera(); };
  }, []);

  useEffect(() => {
    let timer;
    if (isAutoScanMode && cameraActive && !isScanning && sessionActive) {
      timer = setTimeout(() => { captureAndScan(); }, 1200); 
    }
    return () => clearTimeout(timer);
  }, [isAutoScanMode, cameraActive, isScanning, sessionActive]);

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{ facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720} }
      });
      streamRef.current = stream;
      if (videoRef.current) {
        videoRef.current.srcObject = stream;
        await videoRef.current.play();
        setCameraActive(true);
        setStatusMsg('請將 QR Code 對準左下，金額對準右上綠框');
      }
    } catch (err) {
      setStatusMsg('相機啟動失敗');
    }
  }

  function stopCamera() {
    if (streamRef.current) {
      streamRef.current.getTracks().forEach(track => track.stop());
      streamRef.current = null;
    }
    setCameraActive(false);
  }

  function handleStartSession(method) {
    setPaymentMethod(method);
    setSessionActive(true);
    setIsAutoScanMode(false);
    setStatusMsg(`正在開啟 ${method} 掃描模式...`);
    startCamera();
  }

  function handleEndSession() {
    setSessionActive(false);
    setIsAutoScanMode(false);
    stopCamera();
  }

  function prepareCanvas() {
    const video = videoRef.current;
    const canvas = canvasRef.current;
    const targetBox = targetBoxRef.current;
    
    if (!video || !targetBox) throw new Error("DOM 未載入");

    // 取得實際畫面的縮放比例
    const videoRect = video.getBoundingClientRect();
    const scaleX = video.videoWidth / videoRect.width;
    const scaleY = video.videoHeight / videoRect.height;

    // 取得綠色「金額擷取框」在螢幕上的位置
    const boxRect = targetBox.getBoundingClientRect();
    
    // 計算在真實影片像素中的裁切座標
    const cropX = (boxRect.left - videoRect.left) * scaleX;
    const cropY = (boxRect.top - videoRect.top) * scaleY;
    const cropW = boxRect.width * scaleX;
    const cropH = boxRect.height * scaleY;

    canvas.width = cropW; 
    canvas.height = cropH;
    
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    // 只畫出右上角金額框內的影像
    ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
    
    // 極致二值化去雜訊
    const img = ctx.getImageData(0, 0, cropW, cropH);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const gray = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      const color = gray > 130 ? 255 : 0; 
      d[i] = d[i+1] = d[i+2] = color;
    }
    ctx.putImageData(img, 0, 0);
    return canvas.toDataURL('image/jpeg', 0.9);
  }

  async function captureAndScan() {
    if (busyRef.current || !videoRef.current || !cameraActive || !workerRef.current) return;
    busyRef.current = true;
    setIsScanning(true);
    
    try {
      const imageData = prepareCanvas();
      const result = await workerRef.current.recognize(imageData);
      parseOCRData(result?.data?.text || '');
    } catch (err) {
      setStatusMsg(`辨識錯誤`);
      setIsScanning(false);
    } finally {
      busyRef.current = false;
    }
  }

  function parseOCRData(text) {
    const normalized = text.replace(/[＄﹩S5s]/g, '$').replace(/[，,]/g, '').replace(/\s+/g, '');
    
    // 因為只有截取金額區域，直接抓取第一組連續數字
    const match = normalized.match(/([0-9]{2,6})/);

    if (match) {
      const amt = Number(match[1]);
      if (amt > 0) {
        handleAddRecord(amt);
        return;
      }
    }

    if (isAutoScanMode) {
      setStatusMsg('連拍中：等待金額進入右上角綠框...');
      setIsScanning(false);
      return;
    }
    setStatusMsg(`綠框內未找到有效數字`);
    setIsScanning(false);
  }

  function handleAddRecord(amount) {
    const newItem = {
      id: Date.now() + Math.random(),
      amount: amount,
      payMethod: paymentMethod,
      timestamp: new Date().toLocaleTimeString('zh-TW', {hour12:false})
    };
    setScannedItems(prev => [newItem, ...prev]);
    setManualAmount('');
    setIsScanning(false);
    setFlash(true);
    setTimeout(() => setFlash(false), 250);
    setStatusMsg(`✅ 已加入 $${amount.toLocaleString()}`);
  }

  function handleEditAmount(id, currentAmount) {
    const newAmtStr = window.prompt('請輸入修改後的金額：', currentAmount);
    if (newAmtStr !== null) {
      const newAmt = parseInt(newAmtStr, 10);
      if (Number.isFinite(newAmt) && newAmt > 0) {
        setScannedItems(prev => prev.map(item => item.id === id ? { ...item, amount: newAmt } : item));
      }
    }
  }

  function handleDelete(id) {
    setScannedItems(prev => prev.filter(item => item.id !== id));
  }

  return (
    <div className="h-screen flex flex-col w-full bg-gray-100 overflow-hidden relative">
      <div className={`h-[20vh] bg-blue-600 text-white p-4 shadow-lg z-20 shrink-0 flex flex-col justify-between transition-colors ${flash ? 'flash-active bg-emerald-500' : ''}`}>
        <div className="flex justify-between items-start gap-2">
          <div className="min-w-0">
            <h1 className="text-sm md:text-base font-semibold opacity-90 mb-1">{sessionActive ? `即時加總：${paymentMethod}` : '總累計金額'}</h1>
            <div className="flex items-baseline space-x-2">
              <span className="text-xl md:text-2xl font-bold">NT$</span>
              <span className="text-4xl md:text-6xl font-extrabold tracking-tight leading-none">
                {(sessionActive ? totals[paymentMethod] : grandTotal).toLocaleString()}
              </span>
            </div>
          </div>
          <div className="flex flex-col items-end space-y-2 shrink-0">
            <span className="bg-white/20 px-3 py-1 rounded-full text-xs font-bold">
              共 {sessionActive ? currentSessionItems.length : scannedItems.length} 筆
            </span>
            {sessionActive && (
              <button onClick={handleEndSession} className="bg-red-500 text-white font-black py-2 px-6 rounded-lg shadow-md border-2 border-red-400">完成</button>
            )}
          </div>
        </div>
        <p className="text-xs md:text-sm mt-1 opacity-95 truncate bg-black/20 p-1.5 rounded">{statusMsg}</p>
      </div>

      <div className="h-[80vh] w-full relative min-h-0">
        {!sessionActive ? (
          <div className="flex flex-col h-full p-4 overflow-y-auto hide-scrollbar">
            <h2 className="text-gray-700 font-bold mb-3 flex items-center"><CameraIcon/><span className="ml-2">點擊開啟相機：</span></h2>
            <div className="flex gap-3 mb-6 shrink-0">
              {['現金','刷卡','LINE PAY'].map(method => (
                <button key={method} onClick={() => handleStartSession(method)} className="flex-1 py-5 text-base font-black rounded-xl text-white shadow-md bg-blue-600 active:scale-95">{method}</button>
              ))}
            </div>
            
            <div className="flex-1 pb-10">
              <h2 className="text-gray-500 font-bold mb-3 flex justify-between items-end gap-2">
                <span>掃描紀錄總表 (點擊金額可修改)</span>
                {scannedItems.length > 0 && <button onClick={()=>setScannedItems([])} className="text-red-500 text-xs font-bold px-3 py-1.5 bg-red-50 rounded-md">清除全部</button>}
              </h2>
              {scannedItems.length === 0 ? (
                <div className="text-center py-10 text-gray-400">尚未掃描任何票券</div>
              ) : (
                <ul className="space-y-3">
                  {scannedItems.map((item, index) => (
                    <li key={item.id} className="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border-l-4 border-emerald-500">
                      <div className="flex items-center gap-4">
                        <div className="text-gray-400 font-bold">#{scannedItems.length - index}</div>
                        <div>
                          <span onClick={() => handleEditAmount(item.id, item.amount)} className="block font-black text-2xl cursor-pointer text-blue-700 underline decoration-dashed decoration-blue-300">
                            ${item.amount.toLocaleString()} <EditIcon/>
                          </span>
                          <span className="text-xs text-gray-400">{item.payMethod} • {item.timestamp}</span>
                        </div>
                      </div>
                      <button onClick={() => handleDelete(item.id)} className="p-3 bg-gray-50 rounded-full"><TrashIcon/></button>
                    </li>
                  ))}
                </ul>
              )}
            </div>
          </div>
        ) : (
          <div className="w-full h-full relative bg-black flex flex-col">
            <div className="video-container flex-1 relative">
              <video ref={videoRef} playsInline muted autoPlay></video>
              <canvas ref={canvasRef} className="hidden"></canvas>
              
              {/* === 專屬物理遮罩區塊 === */}
              <div className="absolute inset-0 pointer-events-none flex items-center justify-center bg-black/40">
                <div className="relative w-[320px] h-[240px]">
                  
                  {/* 左下方的 QR Code 提示框 */}
                  <div className="absolute bottom-4 left-4 w-28 h-28 border-2 border-gray-400 border-dashed rounded flex flex-col items-center justify-center opacity-70">
                    <span className="text-gray-300 font-bold text-sm">對準</span>
                    <span className="text-gray-300 font-bold text-sm">QR Code</span>
                  </div>

                  {/* 右上方的「總金額」精確擷取框 (僅裁切此處) */}
                  <div 
                    ref={targetBoxRef}
                    className="absolute top-4 right-4 w-40 h-16 border-4 border-emerald-400 rounded-lg bg-emerald-500/10 flex items-center justify-center overflow-hidden"
                  >
                    {isScanning && <div className="scan-line"></div>}
                    <span className="absolute -top-6 text-emerald-300 text-xs font-bold bg-black/60 px-2 py-0.5 rounded">總金額 $</span>
                  </div>

                </div>
              </div>
              {/* ======================== */}

            </div>

            {/* 即時清單 */}
            <div className="absolute top-2 left-2 right-2 max-h-48 overflow-y-auto hide-scrollbar z-30 pointer-events-auto space-y-2">
              {currentSessionItems.slice(0, 3).map((item, index) => (
                <div key={item.id} className="flex justify-between items-center bg-white/95 p-2 px-4 rounded-xl shadow-lg border-l-4 border-blue-500 animate-slide-up">
                  <div className="flex items-center gap-4">
                    <span className="text-gray-400 font-bold text-sm">#{currentSessionItems.length - index}</span>
                    <span onClick={() => handleEditAmount(item.id, item.amount)} className="text-xl font-black text-blue-700 cursor-pointer">
                      ${item.amount.toLocaleString()} <EditIcon/>
                    </span>
                  </div>
                  <button onClick={() => handleDelete(item.id)} className="text-red-500 p-2"><TrashIcon/></button>
                </div>
              ))}
            </div>

            <div className="absolute bottom-0 left-0 w-full p-4 bg-gradient-to-t from-black/90 via-black/60 to-transparent pt-10 pb-7 z-20 flex flex-col gap-3 justify-center">
              <form onSubmit={e => { e.preventDefault(); if (manualAmount) handleAddRecord(Number(manualAmount)); }} className="flex gap-2">
                <input type="number" min="1" value={manualAmount} onChange={e=>setManualAmount(e.target.value)} placeholder="手動輸入金額 $" className="flex-1 px-4 py-3 bg-white/95 border border-gray-300 rounded-xl font-bold"/>
                <button type="submit" disabled={!manualAmount} className="px-6 py-3 bg-gray-800 text-white font-bold rounded-xl disabled:opacity-50">加入</button>
              </form>

              <div className="flex gap-2">
                <button onClick={() => setIsAutoScanMode(!isAutoScanMode)} className={`flex-1 py-4 rounded-xl font-black text-base shadow-lg transition-colors ${isAutoScanMode ? 'bg-amber-500 text-white' : 'bg-gray-800 text-white border border-gray-600'}`}>
                  {isAutoScanMode ? '⏸ 停止連拍' : '▶️ 自動連拍'}
                </button>
                <button onClick={captureAndScan} disabled={isAutoScanMode || isScanning || !cameraActive || !ocrWorker} className={`flex-[2] py-4 rounded-xl font-black text-lg shadow-lg ${isAutoScanMode || isScanning ? 'bg-gray-500 text-gray-300' : 'bg-emerald-500 text-white'}`}>
                  {isScanning && !isAutoScanMode ? '擷取中...' : '📸 點擊單拍'}
                </button>
              </div>
            </div>
            
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
